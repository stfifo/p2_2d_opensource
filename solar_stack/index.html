<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solar Matrix Stack</title>
  <style>
    :root { --bg: #05060a; --fg: #c9d1e3; --btn: #151a28; --btn-b: #2a3350; }
    html, body { margin: 0; background: var(--bg); color: var(--fg);
      font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; padding: 12px 0 24px; }
    #stage { position: relative; }
    #stage canvas { display: block; max-width: 100vw; height: auto !important; }
    /* 스택 패널(캔버스 오른쪽)의 우측 상단에 겹쳐 놓는 천체 선택 드롭박스 */
    #view-select { position: absolute; top: 8px; right: 14px; width: 150px;
      background: #151a28; color: var(--fg); border: 1px solid var(--btn-b);
      border-radius: 6px; padding: 4px 8px; font-size: 13px; cursor: pointer; }
    #view-select:hover { border-color: #6c7fc0; }
    #ui { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
    #ui button { background: var(--btn); color: var(--fg); border: 1px solid var(--btn-b);
      border-radius: 6px; padding: 6px 14px; font-size: 14px; cursor: pointer; }
    #ui button:hover { border-color: #6c7fc0; }
    footer { margin-top: 10px; font-size: 12px; opacity: .6; }
    a { color: inherit; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <script src="matstack.js"></script>
  <script src="planets.js"></script>
  <script src="stackview.js"></script>
  <script src="sketch.js"></script>
</head>
<body>
  <div id="stage"></div>
  <div id="ui"></div>
  <footer>Built with <a href="https://github.com/processing/p5.js">p5.js</a> (LGPL-2.1) - 크기와 거리는 화면에 맞춰 축소, 공전 주기는 실제 값</footer>
</body>
</html>
